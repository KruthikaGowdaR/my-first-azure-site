trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# Compile GuessGame.java wherever it is located in the repository folders
- script: |
    FILE_PATH=$(find . -name "GuessGame.java" -print -quit)
    if [ -z "$FILE_PATH" ]; then
      echo "Could not find GuessGame.java anywhere in the repository!"
      exit 1
    fi
    echo "Found file at: $FILE_PATH"
    javac "$FILE_PATH"
  displayName: 'Locate and Compile GuessGame.java'